[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-analytics-backend"
version = "1.0.0"
description = "Camera-Based Analytics Service — backend for the Digital Twin (occupancy, entry/exit, safety, waiting, heat maps)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Spectech" }]

# ---------------------------------------------------------------------------
# Core dependencies — deliberately LIGHTWEIGHT.
# Heavy/optional inference libraries (ultralytics, opencv, openvino, torch,
# onnxruntime) live in the optional groups below and are imported lazily inside
# their concrete backends. This lets the API, geometry, analytics, db and the
# full test suite run with only the core group installed (no GPU, no models).
# ---------------------------------------------------------------------------
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "numpy>=1.26",
    "shapely>=2.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "prometheus-client>=0.20",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "anyio>=4.3",
]

[project.optional-dependencies]
# SQL Server driver (production datastore). Tests use the stdlib sqlite driver.
mssql = ["pyodbc>=5.1"]

# Person detection + tracking + Re-ID. Required to run a real pipeline against
# live cameras; NOT required for unit/integration tests (which use FakeDetector).
inference = [
    "ultralytics>=8.2",
    "opencv-python-headless>=4.9",
    "openvino>=2024.1",
    "onnxruntime>=1.17",
    "supervision>=0.20",
    "Pillow>=10.0",
]

# GPU runtime (TensorRT path). Installed only on GPU hosts.
gpu = ["onnxruntime-gpu>=1.17"]

# Shared cache / pub-sub when workers are scaled out.
redis = ["redis>=5.0"]

# Cross-camera Re-ID embedding backend (OSNet via torchreid / torch).
# Optional: the numpy gallery-matching logic is testable without it.
reid = ["torch>=2.2", "torchvision>=0.17"]

dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "fakeredis>=2.21",
    "redis>=5.0",
]

[project.scripts]
camera-analytics = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "requires_inference: test needs the optional inference deps / model artifacts",
    "requires_gpu: test needs a CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# str+Enum is intentional (members are JSON-serialised via .value); StrEnum would
# change payload identity. FastAPI dependency/parameter callables in argument
# defaults are the framework's idiom, not a mutable-default bug.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []
