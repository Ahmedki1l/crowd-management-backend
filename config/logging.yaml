version: 1
disable_existing_loggers: false

formatters:
  json:
    # Structured JSON logs (HLD 15 — observability). Rendered by app.utils.logging.
    format: "%(asctime)s %(levelname)s %(name)s %(message)s"
  console:
    format: "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: console
    stream: ext://sys.stdout

loggers:
  app:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: false

root:
  level: WARNING
  handlers: [console]
