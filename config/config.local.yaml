# Local runtime config — B1 waiting-area snapshot-pull deployment.
# Loaded via CONFIG_PATH=config/config.local.yaml. Not committed (see .gitignore).
database:
  url: "${DATABASE_URL}"            # sqlite:///./camera_analytics.db from .env

api:
  prefix: "/api/v1"
  auth_secret: "${API_AUTH_SECRET}"
  auth_scheme: "jwt"
  cors_origins: ["*"]

processing:
  # Only these camera IPs pull feed (the 5 B1-OFFICE = waiting-area cameras).
  camera_allowlist_ips:
    - "10.1.13.43"   # CAM-24 (B1-OFFICE)
    - "10.1.13.45"   # CAM-26 (B1-OFFICE)
    - "10.1.13.39"   # CAM-20 (B1-OFFICE)
    - "10.1.13.40"   # CAM-21 (B1-OFFICE)
    - "10.1.13.44"   # CAM-25 (B1-OFFICE)
    - "10.1.13.46"   # CAM-27 (B1-WAITING AREA)
    # B2 office area (b2-office-area)
    - "10.1.13.37"   # CAM-18 (B2-OFFICE)
    - "10.1.13.41"   # CAM-22 (B2-OFFICE)
    - "10.1.13.50"   # CAM-31 (B2-OFFICE)
    - "10.1.13.52"   # CAM-33 (B2-OFFICE)
    # GF waiting area (gf-waiting-area)
    - "10.1.13.20"   # CAM-02 (GF-WAITING)
    # FF waiting area (ff-waiting-area)
    - "10.1.13.34"   # CAM-15 (FF-WAITING)
    # Main entrance gate — entry/exit line-crossing (continuous RTSP, not snapshot)
    - "10.1.13.21"   # CAM-01 MAIN DOOR
  snapshot_pull:
    roles: ["occupancy"]           # occupancy cameras pull HTTP stills (CPU-cheap)
    interval_s: 3.0
    http_port: 80
    scheme: "http"
    path_template: "/ISAPI/Streaming/channels/{channel}/picture"
    auth: "digest"
    timeout_s: 5.0
    count_from_detections: true    # count detections in-zone directly; no tracking
                                   # (unreliable at 3s cadence, only undercounts)

detector:
  model_path: "models/nano_v0_final_openvino_model"  # fine-tuned nano v0 FINAL (early-stopped @55, mAP50 0.97) — fixes furniture FPs + recovers seated/thobe
  runtime: "openvino"
  confidence: 0.30
  imgsz: 1280

tracker:
  reid_enabled: true               # appearance Re-ID — re-links a person when ByteTrack
                                   # briefly loses them (glass/reflection band at the door),
                                   # so an exit crossing survives the track-id change.
                                   # Only the tracked path uses it → effectively door-only
                                   # (engine builds the extractor for tracked cameras only).
  reid_runtime: onnx               # OSNet-AIN as ONNX under onnxruntime (CPU-only, no torch
                                   # at runtime). Exported via scripts/training/export_reid_onnx.py.
  reid_model_path: "models/reid/osnet_ain_x1_0_msmt17.onnx"  # committed here (not just .env)
                                   # so deployment resolves the FILE, not the models/reid dir.
  track_thresh: 0.30               # align with detector.confidence so seated/low-conf
                                   # people (0.2-0.5) can be tracked & counted, not just
                                   # counted in the validation images. Default 0.5 dropped them.

state_machine:
  confirm_enter_frames: 1          # responsive at 0.5 fps snapshot cadence
  confirm_leave_frames: 1

# Save fetched frames to disk to build a detector training set. Occupancy (ISAPI)
# cameras save original JPEG bytes; the RTSP door saves its decoded frames (encoded).
dataset_capture:
  enabled: false
  dir: "training_data"             # <camera>/<date>/<timestamp>.jpg
  min_interval_s: 1.0              # per-camera cap. Keeps every occupancy pull (3s
                                   # cadence) and limits the high-fps RTSP door to ~1/s.