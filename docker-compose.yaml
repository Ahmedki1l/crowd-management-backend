# Local / edge stack (HLD 12.4). The platform gateway/reverse proxy is external.
#
# ONE process runs the API and the camera engine (`--api`). That is deliberate, not a
# simplification: `RuntimeWiring` subscribes a `PersistenceProjector` in *every* process
# it runs in, and that projector appends rows — it is not idempotent. A split
# api + worker topology sharing a Redis bus therefore persists each event once per
# process, and (because `--api` also starts the engine for every camera) runs the
# pipeline twice as well, multiplying every occupancy sample and crossing event.
#
# If you ever do scale workers out to separate processes, exactly one of them may wire
# the persistence projector. Until then, keep this single-service.
services:
  api:
    build: .
    command: ["python", "-m", "app.main", "--api", "--host", "0.0.0.0", "--port", "8008"]
    environment:
      DATABASE_URL: "sqlite:////app/data/camera_analytics.db"
      API_AUTH_SECRET: "${API_AUTH_SECRET:?set API_AUTH_SECRET in .env}"
      CAMERA_CREDENTIALS_KEY: "${CAMERA_CREDENTIALS_KEY:?set CAMERA_CREDENTIALS_KEY in .env}"
      CONFIG_PATH: "${CONFIG_PATH:-config/config.example.yaml}"
      LOG_LEVEL: "INFO"
    ports:
      - "8008:8008"
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - app_data:/app/data

volumes:
  app_data:
